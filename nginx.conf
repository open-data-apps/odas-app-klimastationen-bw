events { }

http {
    include mime.types;

    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html/app;
            index index.html;
        }

        location = /config {
            alias /usr/share/nginx/html/odas-config/config.json;
            default_type application/json;
            add_header Cache-Control "no-store";
        }

        location /odas-config/ {
            alias /usr/share/nginx/html/odas-config/;
        }

        location /assets/ {
            alias /usr/share/nginx/html/assets/;
        }

        # Icon liegt in assets, bestehende App-Referenzen bleiben gueltig.
        location = /odas-app-icon.svg {
            alias /usr/share/nginx/html/assets/odas-app-icon.svg;
        }

        location = /app/odas-app-icon.svg {
            alias /usr/share/nginx/html/assets/odas-app-icon.svg;
        }
    }
}
